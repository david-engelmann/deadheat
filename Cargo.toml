[package]
name = "deadheat"
version = "0.1.0"
edition = "2021"
description = "Deadheat races two attempts at the same task, one attempt per model, and decides the winner from the recorded results."

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "deadheat"
path = "rust/src/main.rs"

[[bin]]
name = "codepoint_scan"
path = "rust/src/bin/codepoint_scan.rs"

# The integration tests live beside the library under rust/tests, so
# each one is named here with its path rather than discovered from a
# root level tests directory.
[[test]]
name = "test_races"
path = "rust/tests/test_races.rs"

