        <text x="54" y="84" class="sans" font-size="13" font-weight="700" fill="#151411">Task · land the settings migration</text>
        <rect x="54" y="98" width="490" height="48" rx="6" fill="#d1fae5"/>
        <text x="68" y="119" class="mono" font-size="12" font-weight="700" fill="#047857">WINNER  shadow-1 (shadow worktree)</text>
        <text x="68" y="136" class="mono" font-size="11.5" fill="#151411">GREEN in 640.75s · 121,900 tokens · margin 171.65s</text>

        <rect x="54" y="156" width="490" height="48" rx="6" fill="#fee2e2"/>
        <text x="68" y="177" class="mono" font-size="12" font-weight="700" fill="#b91c1c">LOSER   prime-1 (home worktree)</text>
        <text x="68" y="194" class="mono" font-size="11.5" fill="#151411">RED in 812.40s · 152,300 tokens · patch adoptable</text>

        <rect x="580" y="60" width="304" height="172" rx="8" fill="#ffffff" stroke="#dcd5c7"/>
