<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 549" width="920" height="549" role="img"><title>deadheat - head-to-head model duel runner and tournament standings</title><style>.sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }@keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }.live-dot { animation: pulseGlow 2.8s ease-in-out infinite; }@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }</style><rect x="1" y="1" width="918" height="547" rx="14" fill="#faf8f4" stroke="#dcd5c7" stroke-width="1.5"/>
        <text x="36" y="44" class="sans" font-size="13" font-weight="700" fill="#575249" letter-spacing="0.8">TWO-LANE DUEL TELEMETRY &amp; 5% CLOSE-CALL ADJUDICATION</text>
